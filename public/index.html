function ghostChat(){return chatBox('ghost','Ghost chat',G.gmsgs,!G.chatOff,'','Only players who are out can see this.','')}

function taskRows(ghost){return G.mine.map((t,i)=>{const pend=(PEND[i]||0)>Date.now()&&!t.done;

function notebook(share){if(!G.notes.length)return '';const can=share&&G.phase&&G.phase.k==='talk'&&G.me.alive&&!G.chatOff;

function downCard(){return `<div class="alert" role="alert"><svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#FF5C6C" stroke-width="2"/><path d="M12 7v6M12 16v1" stroke="#FF5C6C" stroke-width="2"/></svg><div class="grow"><div class="h" style="color:var(--bad);font-size:18px">You were attacked</div><div class="mut">A medic may still save you. Time left: <span class="mono" id="dn"></span> s. You cannot act until then.</div></div></div>`}
function abilityCard(){const a=G.ab;if(!a||!G.me.alive)return '';const cd=a.cd>0,out=a.uses===0,others=G.P.filter(p=>p.alive&&p.id!==G.you),dis=cd||out;
  const left=a.uses>0?a.uses+' use'+(a.uses>1?'s':'')+' left':a.uses<0?'unlimited':'no uses left';

  let body='';

  else if(a.cls==='scientist')body=`<button class="btn" data-ab="x" ${dis||!a.can?'disabled':''} data-tip="Works during a sabotage or for 45 seconds after it. Once per sabotage.">Analyze last sabotage</button>`;
  else if(a.cls==='engineer')body=`<button class="btn" data-ab="x" ${dis?'disabled':''} data-tip="Shows how many people are at each station right now">Open maintenance panel</button><div class="mut" style="font-size:12px">You also repair the reactor faster.</div>`;
  else if(a.cls==='medic')body=G.downs.length?G.downs.map((d,i)=>`<button class="btn bad" ${i?'':'id="hb"'} data-hold="save" data-id="${d.id}" ${dis&&0?'disabled':''}>Hold to save ${esc(d.name)} (${esc(d.st)}, ${Math.max(0,Math.ceil(d.left))}s)${i?'':'<i class="fill" id="hf"></i>'}</button>`).join(''):'<div class="mut">No one needs saving. You will be alerted if a player is attacked.</div>';
  return `<div class="card"><div class="row sp"><div class="h">${esc(a.name)}</div><span class="mut">${left}${a.cls==='medic'||a.cls==='guardian'||a.cls==='scientist'?'':' - <span id="abcd"></span>'}</span></div><div class="mut" style="font-size:12px">${esc(a.desc)}</div>${body}</div>`}
function attackCard(){const a=G.atk;if(!a||!G.me.alive)return '';const off=a.cd>0||a.used>=a.max;
  return `<div class="card"><div class="row sp"><div class="h" style="color:var(--bad)">Attack</div><span class="mut">${a.used} of ${a.max} used</span></div><div class="mut" style="font-size:12px">You must be alone with exactly one crew member. They are downed, and a medic may save them. A shield blocks it. Cooldown: <span id="atcd"></span></div><button class="btn bad" data-atk="${a.target?a.target.id:''}" ${off||!a.target?'disabled':''} data-tip="${dev==='PC'?'Key: A':''}">${a.target?'Attack '+esc(a.target.name):'No lone target here'}</button></div>`}

const V={
lobby(){const set=G.set,n=G.P.length,tc=traitorsFor(n),min=set.quick?3:5,ok=n>=min,host=G.host===G.you,rev=set.reveal==null?tc===1:set.reveal,crew=n-tc,R=rulesFor(set);

login(){return `<div class="card" style="align-items:center;text-align:center;padding:30px 16px">${LOGO(96)}<div class="h amb" style="font-size:26px">Traitor in the Room</div><div class="mut">Sign in to play. Pick your nickname next.</div></div>

nick(){const n=S.dn!=null?S.dn:myNick(),p=S.dp!=null?S.dp:myPic();return `<div class="card" style="align-items:center;text-align:center"><div class="h amb" style="font-size:22px">Your player profile</div>

home(){const a=S.acct,acct=a?`<div class="card"><div class="row sp"><div class="row">${AV({name:myNick()||a.user,col:'#FFB020',pic:myPic()})}<div><div class="h">${esc(myNick()||a.user)}</div><div class="mut" style="font-size:12px">${a.stats.games} games - ${a.stats.wins} wins - ${a.stats.tasks} tasks</div><div class="mut" style="font-size:12px"><span class="amb">${a.cr||0} credits</span></div></div></div><span class="row" style="gap:6px"><button class="tag" data-a="shop">Shop</button><button class="tag" data-a="editprof">Edit</button><button class="tag" data-a="logout">Sign out</button></span></div></div>`

shop(){const a=S.acct;if(!a)return head()+`<div class="card"><div class="mut">Sign in with an account to earn credits and use the shop.</div></div><button class="btn sec" data-a="shopback">Back</button>`;

reveal(){const me=G.me,t=me.role==='traitor',partner=t?G.P.filter(p=>p.role==='traitor'&&p!==me).map(p=>p.name).join(', '):'';

play(){const me=G.me,tr=me.role==='traitor',left=G.mcd>0;

  if(G.mypair){const mp=G.mypair,who=esc(mp.mine?mp.partner:mp.a);return head()+`<div class="card"><div class="mut">${esc(mp.st)} station - ${esc(mp.task)} - with a partner</div>${mp.partner?`<div class="h" style="font-size:20px">${mp.mine?'Hold together with ':'Helping '}${who}</div><div class="mut">Both of you hold at the same time for 3 seconds.</div><button class="btn" id="hb" data-hold="pair">Hold for 3 seconds<i class="fill" id="hf"></i></button>`:`<div class="h" style="font-size:20px">Waiting for a partner...</div><div class="mut">Other players can join from their screen. The request ends after 25 seconds.</div>`}</div><button class="btn sec" data-a="pcancel">${mp.mine?'Cancel request':'Leave pair task'}</button>`}

  const sab=G.sab?`<div class="alert" role="alert"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 2L23 21H1Z" fill="none" stroke="#FF5C6C" stroke-width="2"/><path d="M12 9v5M12 17v1" stroke="#FF5C6C" stroke-width="2"/></svg><div class="grow"><div class="h" style="color:var(--bad);font-size:17px">Reactor unsafe</div><div class="mut">Fix it before <span class="mono" id="sc"></span> or the traitors win.</div></div></div>${tr?'':`<button class="btn bad" id="hb" data-hold="fix">Hold to fix reactor<i class="fill" id="hf"></i></button>`}`:'';

  ${!W&&tr?traitorChat():''}${!W&&dev==='PC'&&S.help?keysCard():''}`},

  else if(/^wr\d$/.test(a)&&LT){const t=LT;if(t.sel<0)return;const c=t.right[+a[2]];if(t.left[t.sel]===c){t.ok.push(c);t.sel=-1;buzz(25);if(t.ok.length===4){fin();return}}else{buzz([60,40,60]);t.sel=-1}}
  else if(/^s\d$/.test(a)&&LT){const t=LT,k=+a[1];if(t.vals[k]===t.sorted[t.used.length]){t.used.push(k);buzz(25);if(t.used.length===4){fin();return}}else{t.used=[];buzz([60,40,60])}}
  render()});
document.addEventListener('input',e=>{if(e.target.id==='sl'&&LT){LT.val=+e.target.value;const s=$('#sv');if(s)s.textContent=LT.val}});
let dragging=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-hold]');if(b)startHold(b);
  if(e.target.id==='dh'&&LT&&LT.type==='drag'){dragging=true;try{e.target.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()}
  if(e.target.id==='peek'){S.peek=true;render();buzz(30)}});
document.addEventListener('pointermove',e=>{if(!dragging||!LT||LT.type!=='drag')return;const tr=$('#dtr');if(!tr)return;const r=tr.getBoundingClientRect();LT.pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const h=$('#dh');if(h)h.style.left='calc('+LT.pos*100+'% - 22px)'});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{
  if(dragging){dragging=false;if(LT&&LT.type==='drag'){if(Math.abs(LT.pos-LT.tg)<=.08){fin();return}LT.pos=0;LT.msg='Missed the slot. Try again.';buzz([60,40,60]);render()}}
  endHold();if(S.peek){S.peek=false;if(S.scr==='reveal')render()}}));
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('[data-cell]');if(c&&LT&&LT.type==='scan')scanCell(+c.dataset.cell,c)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.peek){S.peek=false;if(S.scr==='reveal')render()}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#peek,[data-hold]'))e.preventDefault()});
/* hover tooltips (mouse only) */
if(matchMedia('(hover:hover)').matches){const T=$('#tip'),at=e=>{T.style.left=Math.min(innerWidth-260,e.clientX+14)+'px';T.style.top=(e.clientY+16)+'px'};
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&t.dataset.tip){T.textContent=t.dataset.tip;T.style.display='block';at(e)}else T.style.display='none'});
  document.addEventListener('mousemove',e=>{if(T.style.display==='block')at(e)});document.addEventListener('click',()=>{T.style.display='none'})}
/* keyboard shortcuts */
function click(sel){const b=document.querySelector(sel);if(b&&!b.disabled){b.click();return true}return false}
function route(e){const k=e.key,scr=S.scr;
  if(k==='?'){S.help=!S.help;render();return true}
  if(scr==='home'||scr==='lobby'||scr==='results'||scr==='reveal'||!G)return false;
  if(scr==='play'||scr==='ghost'){
    if(LT){if(k==='Escape')return click('[data-a=back]');
      if(k===' '){const h=document.querySelector('[data-hold]');if(h){if(!e.repeat)startHold(h);return true}return click('[data-a=tap]')||click('[data-a=stop]')||click('[data-a=lock]')}
      if(k==='Enter')return click('[data-a=lock]')||click('[data-a=stop]');
      if(/^[0-9]$/.test(k)){if(LT.type==='seq')return click('[data-a=n'+k+']');if(LT.type==='memory'||LT.type==='code')return click('[data-a=k'+k+']');if(LT.type==='sort')return click('[data-a=s'+(+k-1)+']')}
      if(k==='Backspace'&&(LT.type==='memory'||LT.type==='code'))return click('[data-a=kc]');return false}
    if(G.mypair){if(k===' '){const h=document.querySelector('[data-hold]');if(h){if(!e.repeat)startHold(h);return true}}if(k==='Escape')return click('[data-a=pcancel]');return false}
    if(/^Digit[1-5]$/.test(e.code))return click('[data-a='+(e.shiftKey?'p':'t')+(+e.code[5]-1)+']');
    if(k==='j'||k==='J')return click('[data-a^=pj]');
    if(k===' '){const h=document.querySelector('[data-hold=fix]');if(h){if(!e.repeat)startHold(h);return true}return false}
    if(S.confirm){if(k==='y'||k==='Y'||k==='Enter')return click('[data-a=meet]');if(k==='n'||k==='N'||k==='Escape')return click('[data-a=no]');return false}
    if(k==='m'||k==='M')return click('[data-a=ask]');
    if(k==='s'||k==='S')return click('[data-a=sab]');
    if(k==='a'||k==='A')return click('[data-atk]:not([disabled])');
    if(k==='c'||k==='C'){const i=document.querySelector('input[data-ch]');if(i){i.focus();return true}}
    return false}
  if(scr==='meeting'){if(k==='c'||k==='C'){const i=document.querySelector('input[data-ch]');if(i){i.focus();return true}}
    const vs=[...document.querySelectorAll('[data-v]')].filter(x=>x.dataset.v!=='skip');if(/^[1-9]$/.test(k)&&vs[+k-1]){vs[+k-1].click();return true}if(k==='0')return click('[data-v=skip]')}
  return false}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target,typing=t&&((t.tagName==='INPUT'&&t.type!=='range')||t.tagName==='TEXTAREA');
  if(typing){if(e.key==='Escape')t.blur();else if(e.key==='Enter'){if(t.dataset.ch){e.preventDefault();sayNow(t.dataset.ch)}else if(t.id==='ap'){e.preventDefault();click('[data-a=login]')}else if(t.id==='au'){e.preventDefault();const p=$('#ap');if(p)p.focus()}}return}
  if(route(e)){e.preventDefault();if(e.key===' '&&document.activeElement&&document.activeElement.blur)document.activeElement.blur()}});
document.addEventListener('keyup',e=>{if(e.key===' '&&hold){endHold();e.preventDefault()}});
let last=performance.now();setInterval(()=>{const n=performance.now(),dt=(n-last)/1000;last=n;if(!G)return;
  if(G.ph==='play'){G.left-=dt;G.mcd=Math.max(0,G.mcd-dt);G.sabCd=Math.max(0,G.sabCd-dt);if(G.sab)G.sab.left-=dt;if(G.ab&&G.ab.cd>0)G.ab.cd-=dt;if(G.atk&&G.atk.cd>0)G.atk.cd-=dt;if(G.down)G.down.left-=dt;G.downs.forEach(d=>d.left-=dt)}
  if(G.phase){G.phase.left-=dt;const e=$('#mt');if(e)e.textContent=fmt(G.phase.left)}
  if(hold){const p=Math.min(1,(n-hold.t0)/hold.ms),f=$('#hf');if(f)f.style.width=p*100+'%';if(p>=1)holdDone()}
  hud()},250);
/* ============ INSTALL, OFFLINE, SCREEN WAKE ============ */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.scr==='home')render()});
addEventListener('appinstalled',()=>{S.inst=null;toast('Installed');if(S.scr==='home')render()});
addEventListener('offline',()=>toast('You are offline. The game will reconnect.'));addEventListener('online',()=>{toast('Back online');if(ws&&ws.readyState!==1)connect()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
/* ============ PROFILE PHOTO + GOOGLE SIGN-IN ============ */
addEventListener('change',e=>{if(!e.target||e.target.id!=='pf'||!e.target.files[0])return;const url=URL.createObjectURL(e.target.files[0]),im=new Image();
  im.onload=()=>{const c=document.createElement('canvas'),z=Math.min(im.width,im.height);c.width=c.height=64;c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,64,64);
    let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>5400&&q>.2){q-=.1;d=c.toDataURL('image/jpeg',q)}URL.revokeObjectURL(url);S.dp=d.length<=5500?d:'';render()};im.onerror=()=>{S.err='That image could not be read.';render()};im.src=url});
let gLoaded=0;
function gInit(){if(!S.gid||!window.google||!google.accounts)return;if(!gInit.done){gInit.done=1;google.accounts.id.initialize({client_id:S.gid,callback:r=>{const go=()=>raw({t:'google',cred:r.credential});ws&&ws.readyState===1?go():connect(go)}})}
  const b=$('#gbtn');if(b&&!b.firstChild)google.accounts.id.renderButton(b,{theme:'filled_black',size:'large',shape:'pill',text:'continue_with',width:280})}
function gRender(){if(!gLoaded){gLoaded=1;fetch('/config.json').then(r=>r.json()).then(c=>{if(!c.google)return;S.gid=c.google;if(S.scr==='login')render();const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=()=>{gInit()};document.head.appendChild(sc)}).catch(()=>{})}else gInit()}
let wl=null;async function wake(on){try{if(on&&!wl&&navigator.wakeLock&&!document.hidden){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){await wl.release();wl=null}}catch(e){wl=null}}
setInterval(()=>wake(!!G&&['reveal','play','meeting','eject'].includes(G.ph)),4000);
render();if(ld('token')&&ld('code'))connect();else if(ld('au')&&ld('as'))connect();else if(S.scr==='login')connect();
