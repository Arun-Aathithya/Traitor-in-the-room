sabotage, meeting with verified pairs, free-text chat channels (lobby, meeting, ghost, traitor), PC layout + keyboard + tooltips,
sound, haptics, ejection animation, share report. -->

<title>Traitor in the Room</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F17;--card:#141A26;--line:#263149;--amb:#FFB020;--txt:#E8ECF4;--mut:#93A0BA;--ok:#3DDC97;--bad:#FF5C6C}
*{box-sizing:border-box;margin:0;padding:0}

body{background-image:linear-gradient(rgba(255,176,32,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,176,32,.045) 1px,transparent 1px);background-size:32px 32px}
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.h{font-family:'Chakra Petch',sans-serif;font-weight:600}.mono{font-family:'IBM Plex Mono',monospace}

.fill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.28);width:0}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,176,32,.16);color:var(--amb)}
.tag{font:12px 'IBM Plex Mono',monospace;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:#B8C2D6;background:none;cursor:pointer}

.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys .btn{height:46px;font-size:18px}
.cell{height:54px;border-radius:10px;background:#1E2740}.cell.hot{background:rgba(255,176,32,.22);box-shadow:0 0 0 1px var(--amb)}.cell.got{background:rgba(61,220,151,.4);box-shadow:0 0 0 1px var(--ok)}
.ej{position:relative;overflow:hidden;min-height:320px;align-items:center;justify-content:center;text-align:center;padding:40px 16px;margin-top:30px}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff9,transparent),radial-gradient(1.5px 1.5px at 70% 60%,#fff9,transparent),radial-gradient(1px 1px at 40% 80%,#fff9,transparent),radial-gradient(1px 1px at 85% 20%,#fff9,transparent);background-size:180px 180px;animation:drift 3.6s linear forwards}
@keyframes drift{to{background-position:-420px 0}}
.flyer{position:absolute;left:-14%;top:38%;animation:fly 3.1s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes fly{0%{left:-14%;top:40%;transform:rotate(0) scale(2);opacity:1}70%{opacity:1}100%{left:112%;top:14%;transform:rotate(1080deg) scale(.2);opacity:0}}

.ejt.now{opacity:1;animation:none}
@keyframes fadein{to{opacity:1}}
#tip{position:fixed;z-index:60;max-width:250px;background:#0f1420;border:1px solid var(--line);color:var(--txt);padding:6px 9px;border-radius:8px;font-size:12px;pointer-events:none;display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f1420;border:1px solid var(--amb);border-radius:10px;padding:8px 14px;font-size:13px;z-index:70;display:none;max-width:90vw}
.col .kb{line-height:1.8}
#app.mid{max-width:560px}
#app.wide{max-width:1280px;display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:16px;align-items:start}
#app.wide .side{position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
#app.wide .chat{max-height:calc(100dvh - 420px);min-height:160px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.flyer,.stars{animation:none}.flyer{display:none}.ejt{opacity:1;animation:none}}
</style></head><body><div id="app"></div><div id="tip" role="tooltip"></div><div id="toast" role="status"></div>
<script>
/* ============ CONSTANTS ============ */
const COL=['#FF7A8A','#FFB36B','#FFD84D','#A3E86B','#4DE8B0','#5CC8FF','#8E9CFF','#C49BFF'];
const SH=['M6 1a5 5 0 1 0 0.001 0Z','M1.5 1.5h9v9h-9Z','M6 1L11 10.5H1Z','M6 0.5L11.5 6L6 11.5L0.5 6Z','M3.2 1.2h5.6L11.5 6L8.8 10.8H3.2L0.5 6Z','M4.5 1h3v3.5H11v3H7.5V11h-3V7.5H1v-3h3.5Z','M6 0.8L11 4.6L9.1 10.6H2.9L1 4.6Z','M3.8 1h4.4L11 3.8v4.4L8.2 11H3.8L1 8.2V3.8Z'];
const TYPEN={seq:'Number sequence',hold:'Hold steady',tap:'Rapid tap',slider:'Dial it in',memory:'Memory check',timing:'Timing',wires:'Wiring',sort:'Sorting',code:'Code entry',drag:'Drag and drop (mouse)',scan:'Hover scan (mouse)'};
const MINMS={seq:900,hold:1800,tap:1200,slider:900,memory:3000,timing:1000,wires:1500,sort:1200,code:1200,drag:800,scan:1200};
const WIRES=[['#FF5C6C','Red'],['#FFD84D','Yellow'],['#3DDC97','Green'],['#5CC8FF','Blue'],['#C49BFF','Violet']];
const TASKS=3,STN=['Reactor','Engine','Lab','Bridge','Cargo','Medbay'];
const rnd=n=>Math.floor(Math.random()*n),buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let W=false;
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
/* ============ SOUND (made with WebAudio, no files) ============ */
const AUD={ctx:null,on:ld('snd')!=='0'};
function actx(){if(!AUD.ctx){try{AUD.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AUD.ctx}
function tone(f,t0,d,ty,v,f2){const c=actx();if(!c||!AUD.on)return;try{const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t0;o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.linearRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(0.0001,n);g.gain.linearRampToValueAtTime(v||.1,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
const SND={ok(){tone(660,0,.12);tone(990,.1,.18)},alarm(){for(let i=0;i<3;i++)tone(880,i*.35,.3,'square',.07,520)},meet(){tone(440,0,.18,'triangle',.14);tone(330,.2,.3,'triangle',.14)},
  eject(){tone(500,0,1.4,'sawtooth',.07,60)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.14,.3,'triangle',.12))},lose(){[392,330,262,196].forEach((f,i)=>tone(f,i*.18,.35,'sawtooth',.07))},msg(){tone(740,0,.07,'sine',.06)}};
['pointerdown','keydown'].forEach(t=>addEventListener(t,()=>{const c=actx();if(c&&c.state==='suspended')c.resume()},{passive:true}));
let tt=0;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2600)}
/* ============ LOGO ============ */
const LOGO=(z=44)=>`<svg width="${z}" height="${z}" viewBox="0 0 64 64" role="img" aria-label="Traitor in the Room logo"><path d="M32 3L57 17.5V46.5L32 61L7 46.5V17.5Z" fill="#141A26" stroke="#FFB020" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="26" r="8" fill="#FFB020"/><path d="M28 31h8l4 17H24Z" fill="#FFB020"/><path d="M32 21.5L35.5 26L32 30.5L28.5 26Z" fill="#141A26"/><circle cx="32" cy="26" r="1.7" fill="#FFB020"/></svg>`;
const AV=p=>`<div class="av" style="background:${p.col}">${esc(p.name[0])}<svg viewBox="0 0 12 12"><path d="${SH[p.shp]}" fill="${p.col}"/></svg></div>`;
/* ============ NET ============ */
const traitorsFor=n=>n>=8?2:1;
const rulesFor=s=>({...(s.classic?{match:240,meet:2,sabMax:3,atkMax:2}:{match:180,meet:3,sabMax:4,atkMax:3}),roles:!!s.roles});
const CLSN={detective:'Detective',engineer:'Engineer',guardian:'Guardian',scientist:'Scientist',scout:'Scout',medic:'Medic'};
const S={scr:'home',name:'',code:'',jc:new URLSearchParams(location.search).get('join')||'',peek:false,confirm:false,sel:null,err:'',cd:0,ready:false,acct:null,help:false,au:'',ap:'',inst:null};
let G=null,hold=null,LT=null,ws=null,seq=0,retry=0,lastSig='',PEND={};
const dev=matchMedia('(pointer:coarse)').matches?'Phone':'PC';
const did=ld('did')||(()=>{const d=Math.random().toString(36).slice(2)+Date.now().toString(36);sv('did',d);return d})();
S.name=ld('name')||'';
function hud(){if(!G)return;const set=(id,v)=>{const e=$(id);if(e)e.textContent=v};set('#clk',fmt(G.left));set('#sc',G.sab?fmt(G.sab.left):'');
  const b=$('#cb');if(b)b.style.width=(G.total?G.done/G.total*100:0)+'%';set('#cdn',G.sabCd>0?fmt(G.sabCd):'ready');set('#mcd',G.mcd>0?fmt(G.mcd):'');set('#abcd',G.ab&&G.ab.cd>0?fmt(G.ab.cd):'ready');set('#atcd',G.atk&&G.atk.cd>0?fmt(G.atk.cd):'ready');set('#dn',G.down?Math.max(0,Math.ceil(G.down.left)):'');const al=$('#al');if(al)al.style.width=G.alone+'%'}
const send=m=>{m.aid=++seq+'-'+Date.now();if(ws&&ws.readyState===1)ws.send(JSON.stringify(m))};
const raw=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(m))};
function connect(then){
  const q=new URLSearchParams(location.search).get('server');
  ws=new WebSocket(q||((location.protocol==='https:'?'wss://':'ws://')+(location.host||'localhost:8080')));
  ws.onopen=()=>{retry=0;if(ld('au')&&ld('as'))raw({t:'resume',user:ld('au'),sess:ld('as')});
    if(then)then();else if(ld('token')&&ld('code'))send({t:'rejoin',code:ld('code'),token:ld('token'),did});else render()};
  ws.onmessage=e=>apply(JSON.parse(e.data));
  ws.onclose=()=>{if(ld('token')){S.err='Connection lost. Reconnecting...';render()}setTimeout(()=>connect(),Math.min(5000,1000*++retry))};
}
setInterval(()=>send({t:'ping'}),10000);
let cerrN=0;const cerr=(msg,src)=>{if(cerrN++<3)raw({t:'cerr',msg:String(msg).slice(0,160),src:String(src||'').slice(0,60)})};
addEventListener('error',e=>cerr(e.message,(e.filename||'').split('/').pop()+':'+e.lineno));addEventListener('unhandledrejection',e=>cerr(e.reason&&e.reason.message||e.reason,'promise'));
const msgSig=a=>a.map(m=>m.id+(m.hid?'h':m.rep?'r':'')).join();
const sig=v=>JSON.stringify([v.ph,v.host,v.set,v.cd,v.ready,v.P.map(p=>[p.id,p.alive,p.online,p.done]),v.mine.map(t=>t.done),!!v.sab,msgSig(v.msgs),msgSig(v.gmsgs),msgSig(v.tmsgs),v.muted,v.chatOff,v.canPair,
  v.pairs.map(x=>x.a),v.mypair&&[v.mypair.partner,v.mypair.i],v.phase&&v.phase.k,v.log.length,v.pl.length,v.cleared.map(c=>c.ids.length),v.meet,v.mcd>0,v.sabCd>0,v.sabUsed,v.alone>=50,!!v.eject,!!v.end,v.notes.length,!!v.down,v.downs.map(d=>d.id),v.ab&&[v.ab.uses,v.ab.cd>0,v.ab.can,v.ab.seen.length],v.atk&&[v.atk.target&&v.atk.target.id,v.atk.cd>0,v.atk.used]]);
function events(o,v){if(!o||o.code!==v.code)return;
  if(v.ph!==o.ph){if(v.ph==='meeting'){SND.meet();buzz([120,60,120])}else if(v.ph==='eject')SND.eject();
    else if(v.ph==='results'&&v.end){const me=v.P.find(p=>p.id===v.you),won=(v.end.w==='crew')===(me.role==='crew');won?SND.win():SND.lose();buzz(won?[80,40,80]:[220])}}
  if(v.notes.length>o.notes.length&&v.notes.length){toast(v.notes[v.notes.length-1].txt);SND.msg();buzz(40)}
  if(!o.down&&v.down){SND.alarm();buzz([200,100,200])}
  if(v.downs.length>o.downs.length){SND.alarm();buzz([150,80,150,80,150])}
  if(!o.sab&&v.sab){SND.alarm();buzz([200,100,200,100,400])}
  const other=x=>[...x.msgs,...x.gmsgs,...x.tmsgs].filter(m=>!m.hid&&!m.mine).length;if(v.ph===o.ph&&other(v)>other(o))SND.msg()}
function apply(m){
  if(m.t==='err'){S.err=m.msg;if(m.fatal){sv('token');sv('code');G=null;S.scr='home'}else toast(m.msg);render();return}
  if(m.t==='joined'){sv('token',m.token);sv('code',m.code);S.code=m.code;return}
  if(m.t==='token'){sv('token',m.token);return}
  if(m.t==='acct'){if(m.user){S.acct={user:m.user,stats:m.stats||{games:0,wins:0,tasks:0}};sv('au',m.user);if(m.sess)sv('as',m.sess);S.err='';S.ap=''}else{S.acct=null;sv('au');sv('as')}if(S.scr==='home')render();return}
  if(m.t==='stats'){if(S.acct)S.acct.stats=m.stats;return}
  if(m.t!=='state')return;
  const v=m.v,was=G&&G.ph,s=sig(v),o=G;events(o,v);G=v;G.me=v.P.find(p=>p.id===v.you);S.code=v.code;S.cd=v.cd;S.ready=v.ready;
  if(G.ph!==was){S.confirm=false;S.sel=null;LT=null;S.peek=false;hold=null;if(was==='lobby'||was==='reveal')PEND={}}
  G.task=LT;
  const map={lobby:'lobby',reveal:'reveal',play:G.me.alive?'play':'ghost',meeting:'meeting',eject:'eject',results:'results'},scr=map[G.ph];
  if(scr!==S.scr||s!==lastSig||S.err){S.err='';S.scr=scr;lastSig=s;render()}else hud();
}
/* ============ TASK MINI-GAMES (the server enforces a minimum time for each) ============ */
function initTask(i,t){const o={i,type:t.type,st:t.st,name:t.name,t0:performance.now(),msg:''};
  if(o.type==='seq'){o.next=1;o.order=[1,2,3,4].sort(()=>Math.random()-.5)}
  else if(o.type==='tap'){o.n=0}
  else if(o.type==='slider'){o.target=15+rnd(71);o.val=50}
  else if(o.type==='memory'||o.type==='code'){o.code=Array.from({length:4},()=>1+rnd(9)).join('');o.inp='';o.show=true;if(o.type==='memory')setTimeout(()=>{if(LT===o){o.show=false;render()}},2500)}
  else if(o.type==='timing'){o.zc=.3+Math.random()*.4;o.zw=.2;o.pos=0}
  else if(o.type==='wires'){const c=WIRES.slice().sort(()=>Math.random()-.5).slice(0,4);o.left=c;o.right=c.slice().sort(()=>Math.random()-.5);o.sel=-1;o.ok=[]}
  else if(o.type==='sort'){const s=new Set();while(s.size<4)s.add(10+rnd(90));o.vals=[...s];o.sorted=[...s].sort((a,b)=>a-b);o.used=[]}
  else if(o.type==='drag'){o.tg=.68+Math.random()*.22;o.pos=0}
  else if(o.type==='scan'){o.hot=[...Array(12).keys()].sort(()=>Math.random()-.5).slice(0,5);o.got=[]}
  return o}
function fin(){const t=LT;if(!t)return;const w=Math.max(0,MINMS[t.type]+200-(performance.now()-t.t0));LT=null;G.task=null;PEND[t.i]=Date.now()+w+2500;
  setTimeout(()=>send({t:'task_done',i:t.i}),w);buzz(70);SND.ok();render()}
function tloop(){if(!LT||LT.type!=='timing')return;const mk=$('#mk');if(mk){LT.pos=(Math.sin((performance.now()-LT.t0)/420-1.5708)+1)/2;mk.style.left='calc('+LT.pos*100+'% - 3px)'}requestAnimationFrame(tloop)}
const keypad=dis=>`<div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn sec" data-a="k${n}" ${dis?'disabled':''}>${n}</button>`).join('')}<button class="btn sec" data-a="kc" ${dis?'disabled':''}>Clear</button><button class="btn sec" data-a="k0" ${dis?'disabled':''}>0</button></div>`;
function taskCard(t){const ty=t.type;let b='';
  if(ty==='seq')b=`<div class="h" style="font-size:20px">Tap 1 to 4 in order</div><div class="row" style="flex-wrap:wrap">${t.order.map(n=>`<button class="btn sec" style="width:calc(50% - 5px)" data-a="n${n}">${n}</button>`).join('')}</div><div class="mut">Next number: ${t.next}</div>`;
  else if(ty==='hold')b=`<div class="h" style="font-size:20px">Hold to stabilise</div><button class="btn" id="hb" data-hold="task">Hold for 2 seconds<i class="fill" id="hf"></i></button>`;
  else if(ty==='tap')b=`<div class="h" style="font-size:20px">Tap 12 times to pump</div><div class="bar"><i style="width:${t.n/12*100}%"></i></div><button class="btn" data-a="tap">Tap (${t.n} of 12)</button>`;
  else if(ty==='slider')b=`<div class="h" style="font-size:20px">Set the dial to <span class="amb mono">${t.target}</span></div><input type="range" id="sl" min="0" max="100" value="${t.val}" style="width:100%" aria-label="Dial"><div class="mono mut" id="sv">${t.val}</div><button class="btn" data-a="lock">Lock it in</button><div class="mut">${esc(t.msg)}</div>`;
  else if(ty==='memory'||ty==='code')b=`<div class="h" style="font-size:20px">${ty==='memory'?'Remember the code':'Enter the code'}</div><div class="mono amb" style="font-size:34px;letter-spacing:.2em;text-align:center">${t.show?t.code.split('').join(' '):'- - - -'}</div><div class="mono" style="font-size:26px;text-align:center;min-height:34px">${t.inp.padEnd(4,'_').split('').join(' ')}</div>${keypad(ty==='memory'&&t.show)}`;

  if(typing){if(e.key==='Escape')t.blur();else if(e.key==='Enter'){if(t.dataset.ch){e.preventDefault();sayNow(t.dataset.ch)}else if(t.id==='ap'){e.preventDefault();click('[data-a=login]')}else if(t.id==='au'){e.preventDefault();const p=$('#ap');if(p)p.focus()}}return}
  if(route(e)){e.preventDefault();if(e.key===' '&&document.activeElement&&document.activeElement.blur)document.activeElement.blur()}});
document.addEventListener('keyup',e=>{if(e.key===' '&&hold){endHold();e.preventDefault()}});
let last=performance.now();setInterval(()=>{const n=performance.now(),dt=(n-last)/1000;last=n;if(!G)return;
  if(G.ph==='play'){G.left-=dt;G.mcd=Math.max(0,G.mcd-dt);G.sabCd=Math.max(0,G.sabCd-dt);if(G.sab)G.sab.left-=dt;if(G.ab&&G.ab.cd>0)G.ab.cd-=dt;if(G.atk&&G.atk.cd>0)G.atk.cd-=dt;if(G.down)G.down.left-=dt;G.downs.forEach(d=>d.left-=dt)}
  if(G.phase){G.phase.left-=dt;const e=$('#mt');if(e)e.textContent=fmt(G.phase.left)}
  if(hold){const p=Math.min(1,(n-hold.t0)/hold.ms),f=$('#hf');if(f)f.style.width=p*100+'%';if(p>=1)holdDone()}
  hud()},250);
/* ============ INSTALL, OFFLINE, SCREEN WAKE ============ */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.scr==='home')render()});
addEventListener('appinstalled',()=>{S.inst=null;toast('Installed');if(S.scr==='home')render()});
addEventListener('offline',()=>toast('You are offline. The game will reconnect.'));addEventListener('online',()=>{toast('Back online');if(ws&&ws.readyState!==1)connect()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
let wl=null;async function wake(on){try{if(on&&!wl&&navigator.wakeLock&&!document.hidden){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){await wl.release();wl=null}}catch(e){wl=null}}
setInterval(()=>wake(!!G&&['reveal','play','meeting','eject'].includes(G.ph)),4000);
render();if(ld('token')&&ld('code'))connect();else if(ld('au')&&ld('as'))connect();
</script></body></html>
